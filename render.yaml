# Render blueprint (repo root): deploys the project's two services.
#
#   orientador-web -> Gradio web interface (app.py)             -> https://orientador-web.onrender.com
#   orientador-mcp -> HTTP API + MCP server (mcp_server.py)     -> https://orientador-mcp.onrender.com
#
# `rootDir: langchain-tool` tells Render where the code is: the build/start
# commands run inside that folder.
#
# Usage:
#   1. Push this repo to GitHub.
#   2. On https://dashboard.render.com -> New -> Blueprint -> connect the repo.
#      (Render detects this render.yaml at the repository root.)
#   3. Render creates both services. Optional: fill in the GOOGLE_API_KEY secret
#      on each service (Environment) to use real Gemini. WITHOUT an API key
#      everything still works in simulated demo mode, so the deployment
#      REQUIRES NO authentication.
#   4. The Python version is set by the root `.python-version` file (3.14),
#      the same version the project is tested with.
#
# Note: Render injects PORT automatically; only HOST=0.0.0.0 is needed.
# No endpoint asks for user/password/API key: they are open (project requirement).

services:
  - type: web
    name: orientador-web
    runtime: python
    plan: free
    rootDir: langchain-tool
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: MODEL_NAME
        value: gemini-2.5-flash
      - key: GOOGLE_API_KEY
        sync: false   # optional secret: filled in manually on the Render dashboard

  - type: web
    name: orientador-mcp
    runtime: python
    plan: free
    rootDir: langchain-tool
    buildCommand: pip install -r requirements.txt
    startCommand: python mcp_server.py
    healthCheckPath: /
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: MODEL_NAME
        value: gemini-2.5-flash
      - key: GOOGLE_API_KEY
        sync: false   # optional secret: filled in manually on the Render dashboard
