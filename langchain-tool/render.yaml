# Blueprint de Render: despliega los dos servicios del proyecto.
#
#   orientador-web -> interfaz Gradio (app.py)         -> https://orientador-web.onrender.com
#   orientador-mcp -> API HTTP + MCP (mcp_server.py)   -> https://orientador-mcp.onrender.com
#
# Uso:
#   1. Sube este repo a GitHub.
#   2. En https://dashboard.render.com -> New -> Blueprint -> conecta el repo.
#   3. Render detecta este archivo y crea ambos servicios.
#   4. Rellena el secret GOOGLE_API_KEY en cada servicio (Environment).
#
# Nota: Render inyecta PORT automáticamente; solo hace falta HOST=0.0.0.0.
# Sin GOOGLE_API_KEY los servicios arrancan igualmente en modo demo simulado.

services:
  - type: web
    name: orientador-web
    runtime: python
    plan: free
    pythonVersion: "3.12"
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: MODEL_NAME
        value: gemini-2.5-flash
      - key: GOOGLE_API_KEY
        sync: false   # secret: se rellena a mano en el dashboard de Render

  - type: web
    name: orientador-mcp
    runtime: python
    plan: free
    pythonVersion: "3.12"
    buildCommand: pip install -r requirements.txt
    startCommand: python mcp_server.py
    healthCheckPath: /
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: MODEL_NAME
        value: gemini-2.5-flash
      - key: GOOGLE_API_KEY
        sync: false   # secret: se rellena a mano en el dashboard de Render
